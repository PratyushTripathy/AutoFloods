version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  jobs:
    post_install:
      - pip install -e ".[docs]"
      - curl -LO https://github.com/quarto-dev/quarto-cli/releases/download/v1.10.18/quarto-1.10.18-linux-amd64.tar.gz
      - tar -xzf quarto-1.10.18-linux-amd64.tar.gz
    build:
      html:
        - cd quartodocs && quartodoc build && ../quarto-1.10.18/bin/quarto render . && mkdir -p $READTHEDOCS_OUTPUT/html && cp -r _site/* $READTHEDOCS_OUTPUT/html/
