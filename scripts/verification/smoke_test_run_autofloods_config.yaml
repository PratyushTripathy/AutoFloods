# Quick smoke test config for scripts/run_autofloods.py -- fresh output
# dir, single tile, single-month wet window, to confirm the standalone
# config-driven script actually drives a real (not skipped) run correctly.
aoi:
  grid_shapefile: ./resources/india_utm_fishnet_buffer.gpkg
  grid_id_list: [321]
  dry_date_col: dry_month
  id_col: ID

dates:
  dry_years: [2024, 2024]
  wet_duration: ['2024/07', '2024/07']

source:
  type: opera

detector:
  type: zscore

detection:
  vv_thd: -2.5
  vh_thd: -2.5
  rel_slope_thd: 20

read:
  overview_level: null
  max_workers: 6

slope:
  dem_overview: 0
  buffer: 500

output_dir: ./output/smoke_test_run_autofloods
slope_dir: ./resources/slope
