project:
  type: website
  output-dir: _site

website:
  title: "AutoFloods"
  description: "Automated flood mapping at scale from Sentinel-1 SAR imagery."
  navbar:
    logo: autofloods_logo.png
    title: false
    left:
      - href: index.qmd
        text: Overview
      - href: getting-started.qmd
        text: Getting Started
      - href: examples.qmd
        text: Examples
      - href: reference/index.qmd
        text: API Reference
    right:
      - icon: github
        href: https://github.com/PratyushTripathy/AutoFloods
  sidebar:
    style: docked
    contents:
      - index.qmd
      - getting-started.qmd
      - examples.qmd
      - section: "API Reference"
        contents:
          - reference/index.qmd

format:
  html:
    theme: cosmo
    toc: true
    css: styles.css

quartodoc:
  package: autofloods
  dir: reference
  title: API Reference
  sections:
    - title: "Pipeline orchestrator"
      desc: "The main entry point most users need."
      contents:
        - flood_mapper
    - title: "Grid generation"
      desc: "Generate a tiling grid from an AOI when you don't already have one."
      contents:
        - grid.generate_grid
    - title: "Data sources"
      desc: "STACSource and its implementations -- how AutoFloods reads Sentinel-1/DEM data."
      contents:
        - sources.STACSource
        - sources.MPCSource
        - sources.OPERASource
    - title: "Flood detectors"
      desc: "FloodDetector and its implementations -- the classification method."
      contents:
        - detectors.FloodDetector
        - detectors.ZScoreDetector
        - detectors.OtsuDetector
    - title: "Preprocessing"
      desc: "Reprojection, clipping, stacking, slope."
      contents:
        - preprocessing.read_sentinel1_stac
        - preprocessing.reproject_clip_stac
        - preprocessing.stack_images
        - preprocessing.clip_xarray_using_id
        - preprocessing.compute_slope
    - title: "Postprocessing"
      desc: "Polygonization and monthly aggregation."
      contents:
        - postprocessing.polygonize_flood_raster
        - postprocessing.smoothen_flood_raster
        - postprocessing.flood_duration_count
        - postprocessing.aggregate_monthly
    - title: "Utilities"
      desc: "Raster I/O, date handling, STAC search helpers."
      contents:
        - utils.open_rasterio_with_retry
        - utils.export_xarray
        - utils.date_range
        - utils.string_to_date_range
        - utils.gpd_to_json
        - utils.decibel_to_linear
        - utils.linear_to_decibel
    - title: "Visualization"
      desc: "Quick-look matplotlib plots of pipeline outputs, read from disk."
      contents:
        - visualize.plot_baseline
        - visualize.plot_terrain
        - visualize.plot_scenes_and_floods
        - visualize.plot_flood_map
