[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autofloods"
version = "0.1.0a22"
description = "Automated flood mapping at scale from Sentinel-1 SAR imagery"
readme = "PYPI_README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Pratyush Tripathy", email = "pratkrt@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "geopandas==0.14.4",
    "fiona==1.10.1",
    "rioxarray==0.14.1",
    "xarray==2024.3.0",
    "pandas==2.2.3",
    "rasterio==1.3.11",
    "shapely==2.0.6",
    "numpy==2.1.0",
    "matplotlib==3.9.2",
    "xarray-spatial==0.4.0",
    "pystac==1.7.2",
    "pystac-client==0.6.1",
    "scikit-image==0.25.0",
    "scikit-learn==1.5.2",
    "planetary-computer==1.0.0",
    "dask[array,dataframe]==2024.4.1",
    "requests==2.31.0",
    "mgrs==1.5.4",
    "tqdm==4.70.0",
]

[project.optional-dependencies]
dev = ["pytest"]
# API reference generation for quartodocs/ (see quartodocs/_quarto.yml).
# Requires griffe<2 -- quartodoc 0.11.1's numpy-docstring parsing breaks
# on griffe 2.x's changed parser signature (a version incompatibility
# found when this was set up, not a version this project needs pinned
# for any other reason). Also requires the Quarto CLI itself (not a
# Python package -- https://quarto.org/docs/get-started/), invoked via
# `quarto render quartodocs/` after `quartodoc build` in that directory.
docs = ["quartodoc", "griffe<2"]

[project.urls]
Homepage = "https://github.com/PratyushTripathy/AutoFloods"
Repository = "https://github.com/PratyushTripathy/AutoFloods"

[tool.setuptools.packages.find]
include = ["autofloods*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
