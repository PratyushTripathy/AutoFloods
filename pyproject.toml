[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autofloods"
version = "2023.9.1"
description = "Automated flood mapping at scale from Sentinel-1 SAR using Z-score thresholding"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "geopandas==0.13.2",
    "rioxarray==0.14.1",
    "xarray==2023.6.0",
    "pandas==1.4.3",
    "rasterio==1.3.3",
    "shapely==2.0.1",
    "numpy==1.23.1",
    "matplotlib==3.5.3",
    "xarray-spatial==0.3.7",
    "pystac==1.7.2",
    "pystac-client==0.6.1",
    "scikit-image==0.19.3",
    "scikit-learn==1.1.2",
    "planetary-computer",
]

[project.optional-dependencies]
dev = ["pytest"]
# API reference generation for quartodocs/ (see quartodocs/_quarto.yml).
# Requires griffe<2 -- quartodoc 0.11.1's numpy-docstring parsing breaks
# on griffe 2.x's changed parser signature (a version incompatibility
# found when this was set up, not a version this project needs pinned
# for any other reason). Also requires the Quarto CLI itself (not a
# Python package -- https://quarto.org/docs/get-started/), invoked via
# `quarto render quartodocs/` after `quartodoc build` in that directory.
docs = ["quartodoc", "griffe<2"]

[tool.setuptools.packages.find]
include = ["autofloods*"]
